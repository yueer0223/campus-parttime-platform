services:
  - type: web
    name: campus-parttime-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/init_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-parttime-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: campus-parttime-db
    plan: free
